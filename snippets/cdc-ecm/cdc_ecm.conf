# USB CDC-ECM transport snippet.
#
# Enables the virtual Ethernet interface plus the deterministic static IPv4
# address on the device and the DHCPv4 server that leases the peer address to
# the host PC, so the link is zero-configuration.
CONFIG_LOCO_PICO_CDC_ECM=y

CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=n
