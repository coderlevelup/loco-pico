# loco-pico base configuration.
#
# USB CDC-ECM is the only transport for this project, so its virtual Ethernet
# interface and the ROS 2 / Pico-ROS Zenoh session are always built in; there is
# no separate build-time snippet to enable them.

# --- GPIO / LED -----------------------------------------------------------------
CONFIG_GPIO=y

# --- USB CDC-ECM virtual Ethernet transport ------------------------------------
CONFIG_LOCO_PICO_CDC_ECM=y

# The device takes 192.0.2.2/24 and leases 192.0.2.1 to the host over DHCPv4, so
# the link is zero-configuration on the host side.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=n

# --- Logging --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# --- Networking core ------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_MAX_CONTEXTS=4
# RP2040 has no entropy driver, so allow the non-random fallback for the network
# stack. Boards with a real entropy source (such as the ESP32-S3) still prefer
# their hardware RNG.
CONFIG_TEST_RANDOM_GENERATOR=y

# --- Networking buffers / stacks (tuned for RP2040's 264 KB SRAM) ---------------
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_NET_TX_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

# --- Quiet the USB / DHCP stacks on the console --------------------------------
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ECM_LOG_LEVEL_OFF=y

# --- Zenoh / Pico-ROS transport ------------------------------------------------
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_QUERY=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_LINK_UDP_MULTICAST=y
CONFIG_ZENOH_PICO_SCOUTING=y
